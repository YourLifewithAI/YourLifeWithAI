name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build registry
        run: node scripts/build-registry.mjs

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/assets
          cp registry.json _site/
          mkdir -p _site/homes
          for dir in homes/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            if [ "$name" != "_template" ]; then
              cp -r "$dir" "_site/homes/$name"
            fi
          done
          ls -R _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
