name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate homes and build registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate every home
        run: node scripts/validate.mjs

      - name: Build registry (dry run)
        run: node scripts/build-registry.mjs
